# Fallback: regenerate PhoneScan.xcodeproj with XcodeGen (brew install xcodegen && xcodegen)
# if the checked-in project ever gives you trouble.
name: PhoneScan
options:
  bundleIdPrefix: com.allenabraham
  deploymentTarget:
    iOS: "17.0"
targets:
  PhoneScan:
    type: application
    platform: iOS
    sources: [PhoneScan]
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allenabraham.PhoneScan
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhoneScan
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
