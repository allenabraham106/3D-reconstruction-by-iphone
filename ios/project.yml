# XcodeGen spec.  On a Mac:  brew install xcodegen && cd ios && xcodegen && open ScanCapture.xcodeproj
name: ScanCapture
options:
  bundleIdPrefix: com.example.scancapture
  deploymentTarget:
    iOS: "17.0"
targets:
  ScanCapture:
    type: application
    platform: iOS
    sources: [ScanCapture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scancapture.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera is used to scan the room in 3D."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # set your team in Xcode (Signing & Capabilities) or here:
        # DEVELOPMENT_TEAM: XXXXXXXXXX
